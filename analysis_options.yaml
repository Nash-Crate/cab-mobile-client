include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    # Generated code
    - test/.test_coverage.dart
    - lib/generated_plugin_registrant.dart
    - "**/i18n/**.g.dart"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.generated.dart"
    #    - "**/*.config.dart"
    # Build
    - 'build/**'
    # Assets
    - 'assets/**'

  #  strong-mode:
  #    implicit-casts: true # allow resolve dynamic automatically
  #    implicit-dynamic: true # allow using Future.delayed(...), instead Future<void>.delayed(...)

  errors:
    always_use_package_imports: error
    avoid_relative_lib_imports: error
    close_sinks: ignore
    collection_methods_unrelated_type: warning
    lines_longer_than_80_chars: ignore # prefer using 100 chars per line (https://github.com/dart-lang/dart_style/issues/833)
    missing_required_param: error
    missing_return: error
    record_literal_one_positional_no_trailing_comma: error
    unrelated_type_equality_checks: warning

linter:
  rules:
    sort_pub_dependencies: false
