targets:
  $default:
    # build_runner
    sources:
      # Note that it is important to include these in the default target.
      - pubspec.*
      - $package$
      - lib/$lib$
      - lib/**
      # additional sources
      - test/**
#      - graphql/**

    builders:
      freezed:
        options:
          format: false # Disable formatting of generated files, to improve generation performance.
          union_key: __typename
          union_value_case: pascal
